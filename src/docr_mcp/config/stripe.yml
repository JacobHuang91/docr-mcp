name: "Stripe"
description: "Stripe payment processing documentation"
parser: "stripe"

index:
  source: "https://docs.stripe.com/llms.txt"
  timeout: 30

tools:
  search_docs:
    description: |
      Search Stripe payment processing documentation.

      Stripe is a payment processing platform. Use this tool when the user asks about:
      - Payment processing and checkout
      - Payment methods (cards, wallets, bank transfers, buy now pay later)
      - Stripe Checkout (hosted payment pages)
      - Payment intents and setup intents
      - Subscriptions and billing
      - Stripe Connect (platforms and marketplaces)
      - Webhooks and events
      - Stripe API and SDKs
      - Testing payments
      - Payment security and PCI compliance
      - Refunds and disputes
      - Payouts and bank accounts
      - Payment analytics
      - Tax collection with Stripe Tax
      - Currency support
      - Payment Links
      - Customer portal
      - Invoicing
      - Radar (fraud prevention)

      Returns a list of relevant documentation pages with titles and URLs ranked by relevance.

  fetch_doc:
    description: |
      Fetch the full content of a specific Stripe documentation page.

      Provide a URL from search results to get the complete markdown or HTML content
      of the documentation page. Use this after searching to read detailed information.
